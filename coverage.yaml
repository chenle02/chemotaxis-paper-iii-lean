- paper:
    number: Lemma 5.1 (deductions)
    title: Deductions of the constant-limit lemma
    label: L:minimal-spike-limit
    statement: "\\begin{lemma}\\label{L:minimal-spike-limit}\n  Fix all model parameters except $\\chi_0$. Let $(u_n,v_n)$\
      \ be positive\n  stationary solutions of~\\eqref{E:main-PE} with $\\chi_0 = \\chi_n \\to \\infty$.\n  Assume\
      \ either $a, b > 0$, with $u^* = (a/b)^{1/\\alpha}$, or $a = b = 0$ and\n  $\\int_0^L u_n\\,dx = Lu^* > 0$.\
      \ Suppose $\\sup_n\\|u_n\\|_{L^r(0,L)} < \\infty$ for\n  some finite $r > \\max\\{1, \\gamma\\}$, and put\
      \ $q = r/\\gamma > 1$. There exist a\n  subsequence $\\{n_k\\}$ and a constant $c \\ge 0$ such that\n  \\\
      begin{equation}\\label{E:minimal-spike-limit-1}\n    u_{n_k}^\\gamma\\rightharpoonup c\\,\\,\\text{ in }\\\
      ,\\, L^q,\n    \\quad v_{n_k}\\to\\frac\\nu\\mu c\\,\\, \\text{ in }\\,\\, C^1,\n    \\quad v_{n_k}\\rightharpoonup\\\
      frac\\nu\\mu c\\,\\, \\text{ in }\\,\\, W^{2,q}.\n  \\end{equation}\n\\end{lemma}"
