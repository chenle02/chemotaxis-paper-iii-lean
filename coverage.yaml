- paper:
    number: Theorem 1.4
    title: Spike-like stationary solutions
    label: T:spiky-solu-thm
    statement: "\\begin{theorem}[Spike-like stationary solutions]\\label{T:spiky-solu-thm}\n  Let $(u^*,v^*)$ be\
      \ a positive constant solution of~\\eqref{E:main-PE} and\n  $(u_n,v_n)$ be positive nonconstant classical\
      \ stationary solutions\n  of~\\eqref{E:main-PE} with $\\chi_0 = \\chi_n \\to \\infty$ and $\\int_0^L u_n\\\
      ,dx =\n  Lu^*$ for every $n$ in the case that $a = b = 0$. If\n  \\[\n    \\liminf_{n\\to\\infty}\\max_{[0,L]}u_n>u^*,\n\
      \  \\]\n  then there is a subsequence $\\{u_{n_k}\\}$ and a point $x^* \\in [0, L]$ such\n  that, for every\
      \ $\\delta > 0$,\n  \\begin{equation}\\label{E:spiky-thm-eq2}\n    \\max_{[x^*-\\delta,x^*+\\delta]\\cap[0,L]}|(u_{n_k})_x|\n\
      \    \\longrightarrow\\infty\\quad {\\rm as}\\quad n_k\\to\\infty.\n  \\end{equation}\n  Moreover, in the\
      \ non-minimal model, if $0 < \\gamma < 1 + \\alpha$, then\n  \\begin{equation}\\label{E:spiky-thm-eq3}\n \
      \   u_{n_k}^\\gamma\\rightharpoonup c\\,\\,\\text{ in }\\,\\, L^q,\n    \\quad v_{n_k}\\to\\frac\\nu\\mu c\\\
      ,\\, \\text{ in }\\,\\, C^1,\n    \\quad v_{n_k}\\rightharpoonup\\frac\\nu\\mu c\\,\\, \\text{ in }\\,\\,\
      \ W^{2,q}\n  \\end{equation}\n  for $q = \\frac{1+\\alpha}{\\gamma}$ and some constant $0 \\le c \\le\n  (u^*)^\\\
      gamma$.\n\\end{theorem}"
  class: same-assumptions
  note: 'Exact public scope, hypotheses and exclusions: data/public-scope-ledger.json, row paper3/T:spiky-solu-thm.
    This display summary does not extend that scope. Source locator: p. 11, TeX line 990.'
  claims:
  - chemotaxis-bifurcation-lean/chemotaxisbifurcation-classicalspikeblowup-minimal-gradient-blowup
  - chemotaxis-bifurcation-lean/chemotaxisbifurcation-classicalspikeblowup-logistic-gradient-blowup-of-eventual-peak
  - chemotaxis-bifurcation-lean/chemotaxisbifurcation-classicalspikeblowup-logistic-spike-all-tests-of-eventual-peak
