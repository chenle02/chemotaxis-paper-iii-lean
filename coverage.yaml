    statement: "\\begin{proposition}[Linear stability/instability]\\label{P:review-prop-2}\n  Let $(u^*,v^*)$ be\
      \ a positive constant solution of~\\eqref{E:main-PE}. If\n  $\\chi_0 < \\chi^*(u^*)$, then $(u^*, v^*)$ is\
      \ linearly exponentially stable in\n  the case $a, b > 0$, and is linearly exponentially stable with respect\
      \ to\n  perturbations with spatial average $u^*$ in the case $a = b = 0$. If $\\chi_0 >\n  \\chi^*(u^*)$,\
      \ then $(u^*,v^*)$ is linearly unstable.\n\\end{proposition}"
