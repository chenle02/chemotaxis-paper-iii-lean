- paper:
    number: Lemma 4.1
    title: Bounds for stationary solutions of the non-minimal model
    label: L:spiky-solu-lm1
    statement: "\\begin{lemma}\\label{L:spiky-solu-lm1}\n  Assume $a, b > 0$. Let $u^* = \\big(\\frac{a}{b}\\big)^{\\\
      frac{1}{\\alpha}}$. Then\n  the following hold.\n  \\begin{enumerate}[(1)]\n    \\item For every $\\alpha,\
      \ \\gamma, m > 0$, and every nonconstant positive\n      stationary solution $(u,v)$ of~\\eqref{E:main-PE},\n\
      \      \\begin{equation}\\label{E:bound-u-eq1-2}\n        0<\\min_{[0,L]}u<u^*<\\max_{[0,L]}u,\n        \\\
      quad {\\rm and}\\quad\n        \\int_0^L u\\,dx<Lu^*,\\quad\n        \\int_0^L u^{1+\\alpha}\\,dx<L\\left(u^*\\\
      right)^{1+\\alpha}.\n      \\end{equation}\n\n    \\item Assume $0 < \\gamma \\le 1 + \\alpha$ and ${1\\le\
      \ m\\le \\alpha+2}$. For\n      every $\\overline{X} > 0$, there exist $\\theta \\in (0, 1)$ and $ C =\n \
      \     C(\\overline{X}, a, b, \\alpha, \\gamma, \\mu, \\nu, L, m, \\beta) > 0 $ such\n      that every positive\
      \ nonconstant stationary solution with $0 \\le \\chi_0 \\le\n      \\overline{X}$ satisfies\n      \\begin{equation}\\\
      label{E:bound-u-eq3}\n        \\|u\\|_{C^{2+\\theta}([0,L])},\\,\\, \\|v\\|_{C^{2+\\theta}([0,L])}\\le C.\n\
      \      \\end{equation}\n  \\end{enumerate}\n\\end{lemma}"
