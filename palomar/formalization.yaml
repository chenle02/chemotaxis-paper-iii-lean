# Submission-specific metadata; the repository-wide index remains in ../formalization.yaml.
version: v0.4
project:
  name: Analytic estimates and scalar bifurcation results for one-dimensional chemotaxis
  description: 'Twelve Lean-verified results supporting one-dimensional chemotaxis analysis: an absolutely
    summable cosine product integral; existence, localization and local uniqueness of scalar pitchfork
    roots under explicit remainder bounds; a rational cubic-coefficient asymptotic; strict logistic moment
    bounds and uniform nonconcentration; stationary minimal-model flux and exponential identities; endpoint
    measure concentration under a tail hypothesis; first-mode selection under a monotone small-amplitude
    expansion; and rigidity and moment bounds for supplied spike-limit data. This is a selection of analytic
    and conditional scalar results, not a formalization of full PDE bifurcation, center manifolds, global
    continuation or PDE stability.'
  authors:
  - Le Chen
  responsible_maintainers:
  - Le Chen
  license: Apache-2.0
sources:
- title: 'Chemotaxis models with signal-dependent sensitivity and a logistic-type source, III: Bifurcation
    and spike-like solutions'
  authors:
  - Le Chen
  - Ian Ruau
  - Wenxian Shen
  id: arXiv:2610.20976v1
  type: paper
  relationship: formalizes
  note: 'The paper authors are Le Chen, Ian Ruau and Wenxian Shen. Published preprint: arXiv:2610.20976v1.
    Formalization input: October 20, 2026 v2 candidate in https://github.com/chenle02/chemotaxis-paper-iii.
    No arXiv v2 upload or journal submission asserted.'
