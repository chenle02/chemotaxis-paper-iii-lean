acknowledgements: 'Developed and verified with lean-pkg (https://github.com/lean-pkg/lean-pkg; doi:10.5281/zenodo.23272098).
  Lean formalization by Le Chen, with AI assistance in proof drafting, tooling, documentation and fidelity
  review. Paper authors: Le Chen, Ian Ruau and Wenxian Shen. The fresh public release is verified locally;
  no cluster evidence is claimed for this release.

  Formalizes results of Chemotaxis models with signal-dependent sensitivity and a logistic-type source,
  III: Bifurcation and spike-like solutions by Le Chen, Ian Ruau and Wenxian Shen (arXiv:2610.20976v1).

  AI assistance: Codex CLI (OpenAI models) and Claude Code (Anthropic models) for Lean proof drafting,
  documentation and fidelity review.'
